<title>دار الكحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
/* ============================================================
   دار الكحل — porcelain, kohl, and Bethlehem mother-of-pearl.
   Every colour is a token; each of the three theme states gets a
   complete set, so the page never mixes one theme's ink with
   another theme's ground.
   ============================================================ */
:root {
  --ground:      #eff2f1;
  --surface:     #ffffff;
  --surface-2:   #e6ebe9;
  --sunken:      #f7f9f8;
  --ink:         #14181a;
  --ink-soft:    #4a5457;
  --ink-mute:    #7e888b;
  --line:        #d7dedb;
  --line-soft:   #e7ecea;
  --rose:        #96284a;
  --rose-soft:   #fbeef1;
  --good:        #2e6b52;
  --good-soft:   #e6f0ea;
  --warn:        #8a5a12;
  --warn-soft:   #fbf0dc;
  --gone:        #6b7478;
  --gone-soft:   #eaedec;
  --btn-bg:      #14181a;
  --btn-fg:      #f4f7f6;
  --deep:        #14181a;
  --on-deep:     #e7edeb;
  --on-deep-mute:#98a5a4;
  --pearl:       linear-gradient(115deg,#cde4e7 0%,#ded4ee 34%,#f5d9dc 66%,#dbebde 100%);
  --pearl-ink:   #14181a;
  --shadow-1: 0 1px 2px rgba(20,24,26,.06);
  --shadow-2: 0 8px 26px rgba(20,24,26,.10);
  --shadow-3: 0 24px 60px rgba(20,24,26,.26);
  --r-s: 8px;
  --r-m: 14px;
  --r-l: 22px;
  --display: 'Reem Kufi', 'Noto Kufi Arabic', Georgia, serif;
  --ui: 'Almarai', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0e1214;
    --surface:     #171c1f;
    --surface-2:   #202629;
    --sunken:      #12171a;
    --ink:         #e8edeb;
    --ink-soft:    #a9b4b3;
    --ink-mute:    #7c8789;
    --line:        #2a3235;
    --line-soft:   #222a2d;
    --rose:        #ec8aa5;
    --rose-soft:   #331a22;
    --good:        #69c199;
    --good-soft:   #16261f;
    --warn:        #dca854;
    --warn-soft:   #2a2110;
    --gone:        #8a9497;
    --gone-soft:   #232a2c;
    --btn-bg:      #e8edeb;
    --btn-fg:      #0e1214;
    --deep:        #05090a;
    --on-deep:     #e7edeb;
    --on-deep-mute:#8b9897;
    --pearl:       linear-gradient(115deg,#2a3e42 0%,#37324a 34%,#4a2f36 66%,#2e4034 100%);
    --pearl-ink:   #dde6e4;
    --shadow-1: 0 1px 2px rgba(0,0,0,.45);
    --shadow-2: 0 8px 26px rgba(0,0,0,.5);
    --shadow-3: 0 24px 60px rgba(0,0,0,.66);
  }
}
:root[data-theme="dark"] {
  --ground:      #0e1214;
  --surface:     #171c1f;
  --surface-2:   #202629;
  --sunken:      #12171a;
  --ink:         #e8edeb;
  --ink-soft:    #a9b4b3;
  --ink-mute:    #7c8789;
  --line:        #2a3235;
  --line-soft:   #222a2d;
  --rose:        #ec8aa5;
  --rose-soft:   #331a22;
  --good:        #69c199;
  --good-soft:   #16261f;
  --warn:        #dca854;
  --warn-soft:   #2a2110;
  --gone:        #8a9497;
  --gone-soft:   #232a2c;
  --btn-bg:      #e8edeb;
  --btn-fg:      #0e1214;
  --deep:        #05090a;
  --on-deep:     #e7edeb;
  --on-deep-mute:#8b9897;
  --pearl:       linear-gradient(115deg,#2a3e42 0%,#37324a 34%,#4a2f36 66%,#2e4034 100%);
  --pearl-ink:   #dde6e4;
  --shadow-1: 0 1px 2px rgba(0,0,0,.45);
  --shadow-2: 0 8px 26px rgba(0,0,0,.5);
  --shadow-3: 0 24px 60px rgba(0,0,0,.66);
}

* { box-sizing: border-box; }
/* The viewer shell owns <html>, so direction is claimed here and in script. */
html { direction: rtl; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.shell { width: min(1200px, 100% - 32px); margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the mother-of-pearl hairline — the house signature */
.nacre { height: 3px; background: var(--pearl); }

/* ---------------- masthead ---------------- */
.strip {
  background: var(--deep); color: var(--on-deep-mute);
  text-align: center; font-size: 12.5px; padding: 6px 16px; letter-spacing: .3px;
}
.masthead {
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
  transition: background .2s, color .2s;
}
.masthead.admin { background: var(--deep); color: var(--on-deep); border-bottom-color: transparent; }
.masthead-row { display: flex; align-items: center; gap: 13px; padding: 11px 0; }
.mark {
  width: 44px; height: 44px; flex: none; border-radius: 12px;
  background: var(--pearl); color: var(--pearl-ink);
  display: grid; place-items: center; cursor: pointer; border: 0; padding: 0 0 3px;
  font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1;
}
.wordmark { min-width: 0; }
.wordmark h1 { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: .3px; }
.wordmark span {
  display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 2.4px;
  text-transform: uppercase; color: var(--ink-mute); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.masthead.admin .wordmark span { color: var(--on-deep-mute); }
.mast-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 17px; border-radius: 999px; border: 1px solid transparent;
  background: var(--btn-bg); color: var(--btn-fg); font-weight: 700; font-size: 14px;
  cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.4;
  transition: filter .15s, background .15s, border-color .15s, color .15s, transform .1s;
}
.btn:hover { filter: brightness(1.4); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-line { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-line:hover { background: var(--surface-2); border-color: var(--ink-mute); filter: none; }
.btn-quiet { background: var(--surface-2); color: var(--ink-soft); }
.btn-quiet:hover { background: var(--line); color: var(--ink); filter: none; }
.btn-danger { background: transparent; color: var(--rose); }
.btn-danger:hover { background: var(--rose-soft); filter: none; }
.btn-sm { padding: 6px 13px; font-size: 13px; }
.btn-wide { width: 100%; }
.masthead.admin .btn { background: var(--pearl); color: var(--pearl-ink); }
.masthead.admin .btn-line { background: transparent; color: var(--on-deep); border-color: rgba(255,255,255,.26); }
.masthead.admin .btn-line:hover { background: rgba(255,255,255,.11); }

.cart { position: relative; }
.cart b {
  position: absolute; top: -5px; inset-inline-end: -5px;
  min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
  background: var(--rose); color: var(--surface); font-family: var(--mono); font-size: 11px;
  display: grid; place-items: center; border: 2px solid var(--surface);
}
.masthead.admin .cart b { border-color: var(--deep); }

/* ---------------- the promise band ---------------- */
.band { padding: 26px 0 18px; display: grid; gap: 18px; grid-template-columns: minmax(0,1fr) auto; align-items: end; }
.band h2 { font-family: var(--display); font-size: clamp(25px, 3.6vw, 34px); font-weight: 500; line-height: 1.3; max-width: 27ch; }
.band p { color: var(--ink-soft); margin-top: 9px; max-width: 56ch; }
.facts { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; }
.fact { padding: 2px 16px; border-inline-end: 1px solid var(--line); }
.fact:last-child { border-inline-end: 0; padding-inline-end: 0; }
.fact:first-child { padding-inline-start: 0; }
.fact b { display: block; font-family: var(--mono); font-size: 19px; font-weight: 500; letter-spacing: -.4px; }
.fact span { display: block; font-size: 11.5px; color: var(--ink-mute); letter-spacing: .3px; }
@media (max-width: 780px) { .band { grid-template-columns: 1fr; gap: 14px; } }

/* ---------------- the index bar ---------------- */
.index {
  position: sticky; top: 70px; z-index: 30; background: var(--ground);
  padding: 10px 0 8px; border-bottom: 1px solid var(--line-soft);
}
/* the masthead can wrap on a narrow screen, so stop guessing its height there */
@media (max-width: 700px) { .index { position: static; } }
.index-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.find { position: relative; flex: 1 1 220px; min-width: 180px; }
.find input {
  width: 100%; padding: 10px 40px 10px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.find input::placeholder { color: var(--ink-mute); }
.find svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-mute); }
.sortbox { position: relative; flex: none; }
.sortbox select {
  appearance: none; padding: 10px 34px 10px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 14px; cursor: pointer;
}
.sortbox::after {
  content: '▾'; position: absolute; inset-inline-start: 13px; top: 50%;
  transform: translateY(-52%); color: var(--ink-mute); pointer-events: none; font-size: 12px;
}
@media (max-width: 560px) { .sortbox { flex: 1; } .sortbox select { width: 100%; } }
.rail { display: flex; gap: 7px; overflow-x: auto; padding: 9px 0 2px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  font-size: 13.5px; font-weight: 400; display: inline-flex; gap: 7px; align-items: center;
  transition: border-color .15s, color .15s, background .15s;
}
.chip i { font-style: normal; color: var(--ink-mute); }
.chip small { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
.chip:hover { border-color: var(--ink-mute); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 700; }
.chip[aria-pressed="true"] i, .chip[aria-pressed="true"] small { color: var(--surface); opacity: .7; }

/* ---------------- product grid ---------------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); padding: 20px 0 36px; }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 11px; } }

.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.item:hover { border-color: var(--ink-mute); box-shadow: var(--shadow-2); transform: translateY(-2px); }
.item.dim { opacity: .6; }

.shot {
  aspect-ratio: 1; width: 100%; border: 0; padding: 0; display: block;
  background: var(--surface-2); cursor: pointer; position: relative; overflow: hidden;
}
.shot img { width: 100%; height: 100%; object-fit: cover; }
/* a photoless product still gets a considered face: a pearl wash rotated to its
   own id, the section's mark, and the house name */
.wash {
  position: relative; width: 100%; height: 100%; color: var(--pearl-ink); overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.wash-bg { position: absolute; inset: 0; background: var(--pearl); }
.wash em { position: relative; font-family: var(--display); font-size: 40px; font-style: normal; line-height: 1; opacity: .5; }
.wash span { position: relative; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .72; }
.detail-shot .wash em { font-size: 72px; }
.detail-shot .wash span { font-size: 11px; }
.badges { position: absolute; top: 10px; inset-inline-start: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.badge {
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: var(--rose); color: var(--surface); letter-spacing: .2px;
}
.badge-pick { background: var(--pearl); color: var(--pearl-ink); }
.badge-off { background: var(--gone-soft); color: var(--gone); }
.veil { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 74%, transparent); }
.veil span { background: var(--gone); color: var(--surface); padding: 5px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }

.item-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.house { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-mute); }
.item-name { font-size: 14.5px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.state { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.state::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--good); }
.s-low { color: var(--warn); }
.s-gone { color: var(--gone); }
.item-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cost { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.cost b { font-family: var(--mono); font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
.cost s { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }
.plus {
  width: 36px; height: 36px; flex: none; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center;
  font-size: 20px; line-height: 1; padding-bottom: 2px; transition: background .15s, border-color .15s, color .15s;
}
.plus:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.plus:disabled { opacity: .35; cursor: not-allowed; }

.rowbar { display: flex; gap: 6px; padding: 0 14px 13px; }
.rowbar .btn { flex: 1; }
.newcard {
  border: 1.5px dashed var(--line); border-radius: var(--r-m); background: transparent;
  display: grid; place-items: center; align-content: center; gap: 7px; cursor: pointer; color: var(--ink-soft);
  min-height: 250px; font-weight: 700; transition: border-color .15s, color .15s, background .15s;
}
.newcard:hover { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.newcard span:first-child { font-size: 28px; line-height: 1; }

/* ---------------- admin workspace ---------------- */
.desk { padding: 18px 0 4px; }
.desk-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.desk-head h2 { font-family: var(--display); font-size: 21px; font-weight: 500; }
.desk-head p { font-size: 13px; color: var(--ink-mute); }
.tiles { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.tile { background: var(--surface); padding: 13px 15px; display: flex; flex-direction: column; gap: 2px; }
.tile span { font-size: 11.5px; color: var(--ink-mute); letter-spacing: .2px; }
.tile b { font-family: var(--mono); font-size: 21px; font-weight: 500; letter-spacing: -.6px; }
.tile small { font-size: 11px; color: var(--ink-mute); font-family: var(--mono); }
.tile.warn b { color: var(--warn); }
.tile.gone b { color: var(--gone); }
.tile.gain b { color: var(--good); }

.watch { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.watch h3 { font-size: 13px; font-weight: 700; padding: 11px 15px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
.watch ul { list-style: none; margin: 0; padding: 0; }
.watch li { display: flex; align-items: center; gap: 11px; padding: 9px 15px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.watch li:last-child { border-bottom: 0; }
.watch li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch li .sku { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }

/* ---------------- save bar ---------------- */
.savebar { position: fixed; inset-inline: 0; bottom: 0; z-index: 60; background: var(--deep); color: var(--on-deep); box-shadow: var(--shadow-3); }
.savebar-in { display: flex; align-items: center; gap: 12px; padding: 11px 0; flex-wrap: wrap; }
.savebar p { font-size: 13.5px; color: var(--on-deep-mute); }
.savebar .btn { background: var(--pearl); color: var(--pearl-ink); }
.savebar .btn-line { background: transparent; color: var(--on-deep); border-color: rgba(255,255,255,.28); }
.savebar .btn-line:hover { background: rgba(255,255,255,.12); }

/* ---------------- sheets ---------------- */
.scrim { position: fixed; inset: 0; z-index: 80; display: flex; background: rgba(10,14,16,.55); backdrop-filter: blur(4px); animation: fade .16s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--surface); margin: auto; width: min(660px, 100%);
  max-height: 92vh; border-radius: var(--r-l); display: flex; flex-direction: column;
  box-shadow: var(--shadow-3); animation: rise .2s cubic-bezier(.2,.9,.3,1.2); border: 1px solid var(--line);
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.sheet-wide { width: min(780px, 100%); }
.sheet-slim { width: min(430px, 100%); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-head h3 { font-family: var(--display); font-size: 20px; font-weight: 500; flex: 1; }
.sheet-body { padding: 20px; overflow-y: auto; }
.sheet-foot { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--sunken); display: flex; gap: 9px; justify-content: flex-end; flex: none; border-radius: 0 0 var(--r-l) var(--r-l); }
.x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; font-size: 15px; flex: none; }
.x:hover { background: var(--line); color: var(--ink); }
@media (max-width: 620px) {
  .scrim { align-items: flex-end; }
  .sheet { border-radius: var(--r-l) var(--r-l) 0 0; max-height: 94vh; }
  .sheet-foot { border-radius: 0; }
  .sheet-foot .btn { flex: 1; }
}

/* ---------------- forms ---------------- */
.f { margin-bottom: 15px; }
.f > label, .flabel { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: .2px; }
.f input, .f select, .f textarea {
  width: 100%; padding: 10px 13px; border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--sunken); color: var(--ink);
}
.f input:focus, .f select:focus, .f textarea:focus {
  outline: none; border-color: var(--ink); background: var(--surface);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent);
}
.f textarea { min-height: 86px; resize: vertical; line-height: 1.8; }
.f .note { font-size: 12px; color: var(--ink-mute); margin-top: 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
@media (max-width: 560px) { .two, .three { grid-template-columns: 1fr; } }

.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 7px 0; }
.check input { position: absolute; opacity: 0; width: 0; height: 0; }
.check .box { width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .16s; }
.check .box::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform .16s; box-shadow: var(--shadow-1); }
.check input:checked + .box { background: var(--good); }
.check input:checked + .box::after { transform: translateX(-18px); }
.check input:focus-visible + .box { outline: 2px solid var(--rose); outline-offset: 2px; }
.check span:last-child { font-size: 14px; font-weight: 400; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--r-m); padding: 18px; text-align: center; cursor: pointer; background: var(--sunken); transition: border-color .15s, background .15s; }

.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 620px) { .detail { grid-template-columns: 1fr; } }
.detail-shot { aspect-ratio: 1; border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }

.detail-cost s { font-family: var(--mono); font-size: 15px; color: var(--ink-mute); }

.spec div { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }

.stepper span { min-width: 34px; text-align: center; font-weight: 700; font-family: var(--mono); }

/* ---------------- basket ---------------- */
.line { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.line:last-of-type { border-bottom: 0; }
.line-shot { width: 60px; height: 60px; border-radius: var(--r-s); overflow: hidden; flex: none; border: 1px solid var(--line); background: var(--surface-2); }

.meter i { display: block; height: 100%; background: var(--good); transition: width .3s; }

.blank { text-align: center; padding: 52px 20px; color: var(--ink-mute); }
.blank h4 { font-family: var(--display); font-size: 20px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }

/* ---------------- footer ---------------- */
.foot { background: var(--deep); color: var(--on-deep-mute); margin-top: 30px; padding: 34px 0 22px; }
.foot h4 { color: var(--on-deep); font-family: var(--display); font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.foot a { color: var(--on-deep); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.22); }
.foot a:hover { border-bottom-color: currentColor; }

.foot-end { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.13); font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.keyhole { background: none; border: 0; color: var(--on-deep-mute); opacity: .38; cursor: pointer; font-size: 13px; padding: 4px 6px; line-height: 1; border-radius: 4px; }
.keyhole:hover { opacity: 1; }

/* ---------------- toast ---------------- */
.toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--deep); color: var(--on-deep); padding: 10px 17px; border-radius: var(--r-s); font-size: 13.5px; box-shadow: var(--shadow-3); animation: rise .18s; max-width: min(360px, calc(100vw - 36px)); }
.toast.good { background: var(--good); color: #fff; }
.toast.bad { background: var(--rose); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script id="app-script">
(function () {
  'use strict';

  /* The viewer shell owns <html>; claim language and direction for it. */
  document.documentElement.setAttribute('lang', 'ar');
  document.documentElement.setAttribute('dir', 'rtl');

  /* ================= state ================= */
  var state = JSON.parse(document.getElementById('shop-data').textContent);
  var basket = [];
  var owner = false;        /* the shopkeeper is signed in */
  var canWrite = null;      /* null = not yet known, false = this view cannot save */
  var dirty = false;
  var pub = null;           /* the artifact capability, once it resolves */
  var filter = { cat: '', q: '', sort: 'new' };
  var app = document.getElementById('app');

  var BASKET_KEY = 'dk.basket';
  var HOLD_KEY = 'dk.basket.hold';
  var DESK_KEY = 'dk.desk';
  var SALT = 'dar-al-kohl:v1:';

  var SORTS = [
    ['new',  'الأحدث'],
    ['low',  'السعر: من الأقل'],
    ['high', 'السعر: من الأعلى'],
    ['sale', 'الأكثر خصماً']
  ];

  var CITIES = ['القدس','رام الله','البيرة','نابلس','الخليل','بيت لحم','بيت جالا','بيت ساحور','جنين','طولكرم','قلقيلية','أريحا','سلفيت','طوباس','غزة','خان يونس','رفح','دير البلح','الناصرة','حيفا','يافا','عكا','أم الفحم','الطيبة'];

  /* a basket survives a reload; one held across a publish wins */
  try { basket = JSON.parse(localStorage.getItem(BASKET_KEY) || '[]') || []; } catch (e) { basket = []; }
  try {
    var held = sessionStorage.getItem(HOLD_KEY);
    if (held) { basket = JSON.parse(held) || basket; sessionStorage.removeItem(HOLD_KEY); }
  } catch (e) {}
  try { owner = sessionStorage.getItem(DESK_KEY) === '1'; } catch (e) {}

  function keepBasket() { try { localStorage.setItem(BASKET_KEY, JSON.stringify(basket)); } catch (e) {} }
  function keepDesk() { try { owner ? sessionStorage.setItem(DESK_KEY, '1') : sessionStorage.removeItem(DESK_KEY); } catch (e) {} }

  /* ================= helpers ================= */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ils(n) {
    var v = Number(n) || 0;
    return (Math.abs(v % 1) < 0.005 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2)) + ' ₪';
  }
  function photoSrc(v) {
    var s = String(v || '');
    return (s.indexOf('data:image/') === 0 || /^https:\/\//i.test(s)) ? s : '';
  }
  function byId(id) { return state.products.filter(function (p) { return p.id === id; })[0]; }
  function cat(slug) { return state.categories.filter(function (c) { return c.slug === slug; })[0]; }
  function catName(slug) { var c = cat(slug); return c ? c.name : ''; }
  function catIcon(slug) { var c = cat(slug); return c ? c.icon : '◆'; }
  function sku(p) { return 'DK-' + String(p.id).padStart(4, '0'); }
  function tint(p) { return (p.id * 47) % 360; }
  function rate() { return Math.max(0.1, Number(state.settings.usdRate) || 3.7); }

  function toast(msg, kind) {
    var host = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 260);
    }, 3400);
  }
  function markDirty() { dirty = true; render(); }

  /* a pearl wash standing in for a photo, keyed to the product */
  function wash(p, glyph) {
    return '<div class="wash"><i class="wash-bg" style="filter:hue-rotate(' + tint(p) + 'deg)"></i>' +
      '<em>' + esc(glyph || catIcon(p.cat)) + '</em>' +
      (p.house ? '<span>' + esc(p.house) + '</span>' : '') + '</div>';
  }
  function facePhoto(p, alt, big) {
    var src = photoSrc((p.photos || [])[0]);
    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt || p.name) + '"' + (big ? '' : ' loading="lazy"') + '>' : wash(p);
  }

  /* ================= credentials ================= */
  /* Only a salted digest of "email:password" is stored, so neither the
     shopkeeper's address nor the password appears anywhere in the page. */
  function digest(text) {
    if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('nocrypto'));
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }
  function credential(email, pass) {
    return digest(SALT + String(email || '').trim().toLowerCase() + ':' + String(pass || ''));
  }

  /* ================= saving ================= */
  function buildDocument() {
    var style = document.getElementById('app-style').textContent;
    var script = document.getElementById('app-script').textContent;
    var data = JSON.stringify(state).replace(/</g, '\\u003c');
    var close = '<' + '/script>';
    return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + esc(state.settings.name_ar) + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">\n' +
      '<style id="app-style">' + style + '</style>\n' +
      '</head>\n<body>\n' +
      '<div id="app"></div>\n' +
      '<div class="toasts" id="toasts" role="status" aria-live="polite"></div>\n' +
      '<script type="application/json" id="shop-data">' + data + close + '\n' +
      '<script id="app-script">' + script + close + '\n' +
      '</body>\n</html>';
  }

  function readOnly(code) {
    return code === 'not_writer' || code === 'not_granted' || code === 'not_declared' ||
           code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed';
  }

  function save(button) {
    if (!pub) { toast('لا يمكن الحفظ من هذه النسخة من الصفحة.', 'bad'); return; }
    if (button) { button.disabled = true; button.textContent = 'جارٍ الحفظ…'; }
    try { sessionStorage.setItem(HOLD_KEY, JSON.stringify(basket)); } catch (e) {}

    pub.publish(buildDocument()).then(function () {
      dirty = false;   /* every open view reloads to the version just written */
    })['catch'](function (err) {
      var code = err && err.code;
      if (code === 'conflict') return;   /* the shell is already reloading us */
      if (readOnly(code)) {
        canWrite = false; owner = false; keepDesk();
        toast('هذه نسخة للعرض فقط — التعديلات لا تُحفظ منها.', 'bad');
      } else if (code === 'too_large') {
        toast('الصفحة أصبحت كبيرة. احذفي بعض الصور أو استخدمي صوراً أصغر.', 'bad');
      } else if (code === 'rate_limited') {
        toast('حفظٌ كثير خلال وقت قصير. انتظري دقيقة ثم احفظي مرة أخرى.', 'bad');
      } else {
        toast('تعذّر الحفظ. تحقّقي من الاتصال وحاولي مرة أخرى.', 'bad');
      }
      render();
    });
  }

  /* ================= basket ================= */
  function lines() {
    return basket.map(function (b) {
      var p = byId(b.id);
      if (!p || !p.live || p.stock <= 0) return null;
      return { p: p, qty: Math.max(1, Math.min(b.qty, p.stock)) };
    }).filter(Boolean);
  }
  function totals(ls) {
    var sub = ls.reduce(function (s, l) { return s + l.p.price * l.qty; }, 0);
    var free = Number(state.settings.freeOver) || 0;
    var flat = Number(state.settings.shipping) || 0;
    var ship = ls.length === 0 ? 0 : (free > 0 && sub >= free ? 0 : flat);
    return { sub: sub, ship: ship, sum: sub + ship, free: free };
  }
  function count() { return lines().reduce(function (n, l) { return n + l.qty; }, 0); }
  function addToBasket(id, qty) {
    var p = byId(id);
    if (!p || p.stock <= 0) return;
    var found = basket.filter(function (b) { return b.id === id; })[0];
    if (found) found.qty = Math.min(p.stock, found.qty + (qty || 1));
    else basket.push({ id: id, qty: Math.min(p.stock, qty || 1) });
    keepBasket();
    refreshCart();
    toast('أُضيف إلى السلة', 'good');
  }
  function refreshCart() {
    var host = document.getElementById('cartCount');
    if (!host) return;
    var n = count();
    host.innerHTML = n ? '<b class="num">' + n + '</b>' : '';
  }

  /* ================= stats ================= */
  function stats() {
    var r = rate(), s = { live: 0, hidden: 0, gone: 0, low: 0, units: 0, retail: 0, cost: 0 };
    state.products.forEach(function (p) {
      var q = Math.max(0, p.stock || 0);
      if (p.live) s.live++; else s.hidden++;
      if (q <= 0) s.gone++; else if (q <= 3) s.low++;
      s.units += q;
      s.retail += (p.price || 0) * q;
      s.cost += (p.cost || 0) * r * q;
    });
    s.gain = s.retail - s.cost;
    return s;
  }

  /* ================= sheets ================= */
  function openSheet(html, cls) {
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = '<div class="sheet ' + (cls || '') + '" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(scrim);
    document.body.style.overflow = 'hidden';

    var sheet = scrim.firstElementChild;
    var came = document.activeElement;

    function reachable() {
      var sel = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
      return Array.prototype.slice.call(sheet.querySelectorAll(sel)).filter(function (el) { return el.offsetParent !== null; });
    }
    function shut() {
      scrim.remove();
      document.removeEventListener('keydown', onKey);
      if (!document.querySelector('.scrim')) document.body.style.overflow = '';
      /* hand focus back without yanking the page to wherever that control sits */
      if (came && came.focus) { try { came.focus({ preventScroll: true }); } catch (e) {} }
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); shut(); return; }
      if (e.key !== 'Tab') return;
      var f = reachable();
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    document.addEventListener('keydown', onKey);
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) shut(); });
    scrim.querySelectorAll('[data-shut]').forEach(function (b) { b.addEventListener('click', shut); });
    setTimeout(function () {
      var wanted = sheet.querySelector('[data-focus]') || reachable()[0];
      if (wanted) wanted.focus();
    }, 40);

    return { root: scrim, shut: shut, q: function (s) { return scrim.querySelector(s); } };
  }

  function showBasket() {

              '<span>' + l.qty + '</span>' +

            '</div><button class="pull" data-drop="' + l.p.id + '">حذف</button></div>' +
          '</div></div>';
      }).join('');

      var t = totals(ls);
      var gap = Math.max(0, t.free - t.sub);
      foot.innerHTML = '<div style="width:100%">' +
        (t.free > 0
          ? '<div class="meter">' +
              (t.ship === 0
                ? '<p class="done">التوصيل مجاني على هذا الطلب</p>'
                : '<p>أضيفي ' + ils(gap) + ' ليصبح التوصيل مجانياً</p>') +
              '<div><i style="width:' + Math.min(100, Math.round(t.sub / t.free * 100)) + '%"></i></div>' +
            '</div>'
          : '') +
        '<div class="tally"><span>المجموع</span><span>' + ils(t.sub) + '</span></div>' +
        '<div class="tally"><span>التوصيل</span><span>' + (t.ship === 0 ? 'مجاني' : ils(t.ship)) + '</span></div>' +
        '<div class="tally sum"><span>الإجمالي</span><span>' + ils(t.sum) + '</span></div>' +
        '<button class="btn btn-wide" id="toOrder" style="margin-top:13px">إتمام الطلب</button></div>';

      body.querySelectorAll('[data-more]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = Number(b.getAttribute('data-more'));
          var e = basket.filter(function (x) { return x.id === id; })[0];
          var p = byId(id);
          if (e && p) { e.qty = Math.min(p.stock, e.qty + 1); keepBasket(); paint(); refreshCart(); }
        });
      });
      body.querySelectorAll('[data-less]').forEach(function (b) {
        b.addEventListener('click', function () {
          var e = basket.filter(function (x) { return x.id === Number(b.getAttribute('data-less')); })[0];
          if (e) { e.qty = Math.max(1, e.qty - 1); keepBasket(); paint(); refreshCart(); }
        });
      });
      body.querySelectorAll('[data-drop]').forEach(function (b) {
        b.addEventListener('click', function () {
          basket = basket.filter(function (x) { return x.id !== Number(b.getAttribute('data-drop')); });
          keepBasket(); paint(); refreshCart();
        });
      });
      foot.querySelector('#toOrder').addEventListener('click', function () { sheet.shut(); showOrder(); });
    }
    paint();
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var box = document.createElement('textarea');
      box.value = text;
      box.style.position = 'fixed';
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      box.remove();
      ok ? resolve() : reject(new Error('copy'));
    });
  }

  /* ---------- photos ---------- */
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('decode')); };
        img.onload = function () {
          var max = 760;
          var k = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          var g = c.getContext('2d');
          g.fillStyle = '#ffffff';
          g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

          '<div class="drop" id="eDrop" tabindex="0" role="button"><p>اضغطي لاختيار الصور أو اسحبيها هنا</p>' +
          '<small>الصورة الأولى هي الرئيسية · حتى ٦ صور</small></div>' +
          '<input type="file" id="eFile" accept="image/*" multiple hidden>' +
          '<div class="shots" id="eShots"></div></div>' +
      '</div>' +
      '<div class="sheet-foot">' +
        (existing ? '<button class="btn btn-danger" id="eDelete" style="margin-inline-end:auto">حذف المنتج</button>' : '') +
        '<button class="btn btn-line" data-shut>إلغاء</button>' +
        '<button class="btn" id="eSave">' + (existing ? 'تحديث' : 'إضافة') + '</button>' +

    function paintMargin() {
      var price = Number(sheet.q('#ePrice').value) || 0;
      var cost = (Number(sheet.q('#eCost').value) || 0) * rate();
      var host = sheet.q('#eMargin');
      if (!price || !cost) { host.innerHTML = ''; return; }
      var gain = price - cost;
      var pct = Math.round(gain / price * 100);
      host.innerHTML = '<div class="readout' + (gain <= 0 ? ' warn' : '') + '">' +
        (gain > 0
          ? 'ربح ' + ils(gain) + ' على القطعة · هامش ' + pct + '٪'
          : 'سعر البيع أقل من التكلفة (' + ils(cost) + ')') + '</div>';
    }
    sheet.q('#ePrice').addEventListener('input', paintMargin);
    sheet.q('#eCost').addEventListener('input', paintMargin);
    paintMargin();

    function paintShots() {
      sheet.q('#eShots').innerHTML = draft.photos.map(function (u, i) {
        return '<div class="mini"><img src="' + esc(photoSrc(u)) + '" alt="">' +
          '<button data-x="' + i + '" aria-label="حذف الصورة">✕</button>' +
          (i === 0 ? '<em>رئيسية</em>' : '') + '</div>';
      }).join('');
      sheet.q('#eShots').querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () {
          draft.photos.splice(Number(b.getAttribute('data-x')), 1);
          paintShots();
        });
      });
    }
    paintShots();

    function takeFiles(list) {
      var files = Array.prototype.slice.call(list).filter(function (f) { return f.type.indexOf('image/') === 0; });
      if (!files.length) return;
      if (draft.photos.length + files.length > 6) { toast('الحد الأقصى ٦ صور للمنتج', 'bad'); return; }
      var drop = sheet.q('#eDrop');
      var was = drop.innerHTML;
      drop.innerHTML = '<p>جارٍ معالجة الصور…</p>';
      Promise.all(files.map(function (f) { return shrink(f)['catch'](function () { return null; }); }))
        .then(function (urls) {
          urls.forEach(function (u) { if (u) draft.photos.push(u); });
          drop.innerHTML = was;
          paintShots();
        });
    }
    sheet.q('#eDrop').addEventListener('click', function () { sheet.q('#eFile').click(); });
    sheet.q('#eDrop').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sheet.q('#eFile').click(); }
    });
    sheet.q('#eFile').addEventListener('change', function (e) { takeFiles(e.target.files); e.target.value = ''; });
    ['dragenter', 'dragover'].forEach(function (t) {
      sheet.q('#eDrop').addEventListener(t, function (e) { e.preventDefault(); sheet.q('#eDrop').classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      sheet.q('#eDrop').addEventListener(t, function (e) {
        e.preventDefault();
        sheet.q('#eDrop').classList.remove('over');
        if (t === 'drop') takeFiles(e.dataTransfer.files);
      });
    });

    var del = sheet.q('#eDelete');
    if (del) del.addEventListener('click', function () {
      if (!confirm('حذف «' + draft.name + '» من المتجر؟')) return;
      state.products = state.products.filter(function (p) { return p.id !== draft.id; });
      basket = basket.filter(function (b) { return b.id !== draft.id; });
      keepBasket();
      sheet.shut();
      markDirty();
      toast('حُذف المنتج — اضغطي «حفظ التغييرات» لتثبيته', 'good');
    });

    sheet.q('#eSave').addEventListener('click', function () {
      var name = sheet.q('#eName').value.trim();
      var price = Number(sheet.q('#ePrice').value) || 0;
      if (!name) { toast('اكتبي اسم المنتج', 'bad'); sheet.q('#eName').focus(); return; }
      if (price <= 0) { toast('اكتبي سعر بيع أكبر من صفر', 'bad'); sheet.q('#ePrice').focus(); return; }

      draft.name = name;
      draft.blurb = sheet.q('#eBlurb').value.trim();
      draft.house = sheet.q('#eHouse').value.trim();
      draft.cat = sheet.q('#eCat').value;
      draft.price = price;
      draft.was = Number(sheet.q('#eWas').value) || 0;
      draft.cost = Number(sheet.q('#eCost').value) || 0;
      draft.stock = Math.max(0, parseInt(sheet.q('#eStock').value, 10) || 0);
      draft.live = sheet.q('#eLive').checked;
      draft.pick = sheet.q('#ePick').checked;

      if (existing) {
        state.products = state.products.map(function (p) { return p.id === draft.id ? draft : p; });
      } else {
        draft.id = state.products.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1;
        state.products.unshift(draft);
      }
      sheet.shut();
      markDirty();
      toast('حُفظ مؤقتاً — اضغطي «حفظ التغييرات» لنشره', 'good');
    });
  }

  /* ================= browsing ================= */
  function shown() {
    var list = state.products.filter(function (p) { return owner || p.live; });
    if (filter.cat) list = list.filter(function (p) { return p.cat === filter.cat; });
    var q = filter.q.trim().toLowerCase();
    if (q) {
      list = list.filter(function (p) {
        return ((p.name || '') + ' ' + (p.house || '') + ' ' + (p.blurb || '') + ' ' + sku(p)).toLowerCase().indexOf(q) !== -1;
      });
    }
    function off(p) { return p.stock > 0 ? 0 : 1; }
    function disc(p) { return p.was > p.price ? 1 - p.price / p.was : 0; }
    return list.slice().sort(function (a, b) {
      var d = off(a) - off(b);
      if (d) return d;
      if (filter.sort === 'low') return a.price - b.price;
      if (filter.sort === 'high') return b.price - a.price;
      if (filter.sort === 'sale') return disc(b) - disc(a);
      return b.id - a.id;
    });
  }

  function card(p) {
    var sale = p.was > p.price;
    var badges = '';
    if (sale) badges += '<span class="badge">وفّري ' + Math.round((1 - p.price / p.was) * 100) + '٪</span>';
    if (p.pick) badges += '<span class="badge badge-pick">اختيار الدار</span>';
    if (owner && !p.live) badges += '<span class="badge badge-off">مخفي</span>';

    return '<article class="item' + (owner && !p.live ? ' dim' : '') + '">' +
      '<button class="shot" data-open="' + p.id + '" aria-label="' + esc(p.name) + '">' +
        facePhoto(p) +
        (badges ? '<span class="badges">' + badges + '</span>' : '') +
        (p.stock <= 0 ? '<span class="veil"><span>نفدت الكمية</span></span>' : '') +
      '</button>' +
      '<div class="item-body">' +
        (p.house ? '<div class="house">' + esc(p.house) + '</div>' : '') +
        '<h3 class="item-name">' + esc(p.name) + '</h3>' +
        (p.stock > 0 && p.stock <= 3 ? '<div class="state s-low">باقٍ ' + p.stock + ' فقط</div>' : '') +
        (owner && p.stock > 3 ? '<div class="state s-ok">' + p.stock + ' في المخزن</div>' : '') +
        '<div class="item-foot"><span class="cost"><b class="num">' + ils(p.price) + '</b>' +
          (sale ? '<s class="num">' + ils(p.was) + '</s>' : '') + '</span>' +
          (owner ? '' : '<button class="plus" data-add="' + p.id + '"' + (p.stock <= 0 ? ' disabled' : '') +

      '</div>' +
      (owner ? '<div class="rowbar"><button class="btn btn-quiet btn-sm" data-edit="' + p.id + '">تعديل المنتج</button></div>' : '') +
    '</article>';

      (owner && dirty
        ? '<div class="savebar"><div class="shell savebar-in">' +
            '<p>' + (canWrite === false
              ? 'هذه نسخة للعرض فقط — التعديلات لا تُنشر منها.'
              : 'تغييراتكِ لم تُنشر بعد.') + '</p>' +
            '<div style="margin-inline-start:auto;display:flex;gap:8px">' +
            '<button class="btn btn-line btn-sm" id="discard">تجاهل</button>' +
            '<button class="btn btn-sm" id="saveNow"' + (canWrite === false ? ' disabled' : '') +
              '>حفظ التغييرات</button></div>' +
          '</div></div>'
        : '');

    document.body.style.paddingBottom = (owner && dirty) ? '80px' : '';
    renderGrid();
    wire();
  }

  function wire() {
    var settings = document.getElementById('openSettings');
    if (settings) settings.addEventListener('click', editSettings);

    var out = document.getElementById('signOut');
    if (out) out.addEventListener('click', signOut);

    var cart = document.getElementById('openCart');
    if (cart) cart.addEventListener('click', showBasket);

    var saveNow = document.getElementById('saveNow');
    if (saveNow) saveNow.addEventListener('click', function () { save(saveNow); });

    var discard = document.getElementById('discard');
    if (discard) discard.addEventListener('click', function () {
      if (confirm('تجاهل كل التغييرات غير المحفوظة؟')) location.reload();
    });

    /* the low-stock list edits products too */
    document.querySelectorAll('.watch [data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { editProduct(Number(b.getAttribute('data-edit'))); });
    });

    var q = document.getElementById('q');
    var pause;
    q.addEventListener('input', function () {
      filter.q = q.value;
      clearTimeout(pause);
      pause = setTimeout(renderGrid, 130);   /* the field is never rebuilt, so focus stays put */
    });

    document.getElementById('sort').addEventListener('change', function (e) {
      filter.sort = e.target.value;
      renderGrid();
    });

    var chips = document.querySelectorAll('#rail [data-cat]');
    chips.forEach(function (b) {
      b.addEventListener('click', function () {
        filter.cat = b.getAttribute('data-cat');
        chips.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        renderGrid();
      });
    });

    /* the way in: the mark, tapped five times, or the mark at the foot */
    var taps = [];
    document.getElementById('mark').addEventListener('click', function () {
      var now = Date.now();
      taps = taps.filter(function (t) { return now - t < 2500; });
      taps.push(now);
      if (taps.length >= 5) { taps = []; showSignIn(); }
    });
    document.getElementById('keyhole').addEventListener('click', showSignIn);
  }

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  render();

  if (location.hash === '#in' && !owner) showSignIn();

  /* The capability resolves after this script's first run, never during it. */
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (ns) {
      pub = ns;
      if (!ns) { canWrite = false; render(); }
    })['catch'](function () { canWrite = false; render(); });
  } else {
    canWrite = false;
  }
})();
</script>
