<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a1528">
<title>تسجيل الدخول · Sign in</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237d2b48'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle'%3E%F0%9F%92%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="auth-page">

<main class="auth-card">
  <div class="auth-top">
    <button class="lang-btn" id="langBtn" type="button">English</button>
  </div>

  <div class="auth-brand">
    <div class="brand-mark">💄</div>
    <h1 id="shopName">الطليل الغالي</h1>
    <p id="authSub">سجّلي الدخول للمتابعة</p>
  </div>

  <p class="error-text alert-box" id="pageError" hidden></p>

  <div id="providers" hidden>
    <div class="provider-stack">
      <a class="provider-btn" id="googleBtn" href="/auth/google" hidden>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.92v2.33A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.95 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.92a9 9 0 0 0 0 8.08l3.03-2.33Z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.59C13.46.9 11.43 0 9 0A9 9 0 0 0 .92 4.96l3.03 2.33C4.66 5.16 6.65 3.58 9 3.58Z"/>
        </svg>
        <span id="googleLabel">المتابعة باستخدام Google</span>
      </a>
      <a class="provider-btn provider-apple" id="appleBtn" href="/auth/apple" hidden>
        <svg width="17" height="18" viewBox="0 0 17 20" aria-hidden="true" fill="currentColor">
          <path d="M14.1 10.6c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.7-.4 6.6 1.1 8.8.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7 1.3 0 1.6.7 2.8.7 1.1 0 1.9-1.1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.2-.9-2.2-3.6ZM11.9 4.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2Z"/>
        </svg>
        <span id="appleLabel">المتابعة باستخدام Apple</span>
      </a>
    </div>
    <div class="or-rule"><span id="orText">أو</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab is-active" id="tabLogin" type="button" role="tab" aria-selected="true">تسجيل الدخول</button>
    <button class="tab" id="tabRegister" type="button" role="tab" aria-selected="false">حساب جديد</button>
  </div>

  <!-- Sign in -->
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="loginEmail">البريد الإلكتروني</label>
      <input class="input" type="email" id="loginEmail" dir="ltr" autocomplete="email"
             inputmode="email" placeholder="name@example.com" required>
    </div>
    <div class="field">
      <label for="loginPassword">كلمة المرور</label>
      <div class="pw-wrap">
        <input class="input" type="password" id="loginPassword" dir="ltr"
               autocomplete="current-password" required>
        <button class="pw-eye" type="button" data-eye="loginPassword" aria-label="إظهار كلمة المرور">👁</button>
      </div>
    </div>
    <p class="error-text" id="loginError" hidden></p>
    <button class="btn btn-lg btn-block" type="submit" id="loginBtn">دخول</button>
    <p class="hint" id="socialNote" style="text-align:center;margin-top:10px;" hidden></p>
  </form>

  <!-- Create an account -->
  <form id="registerForm" novalidate hidden>
    <div class="field">
      <label for="regName">الاسم الكامل</label>
      <input class="input" id="regName" maxlength="80" autocomplete="name">
    </div>
    <div class="field">
      <label for="regEmail">البريد الإلكتروني</label>
      <input class="input" type="email" id="regEmail" dir="ltr" autocomplete="email"
             inputmode="email" placeholder="name@example.com" required>
    </div>
    <div class="field">
      <label for="regPassword">كلمة المرور</label>
      <div class="pw-wrap">
        <input class="input" type="password" id="regPassword" dir="ltr"
               autocomplete="new-password" required>
        <button class="pw-eye" type="button" data-eye="regPassword" aria-label="إظهار كلمة المرور">👁</button>
      </div>
      <div class="pw-meter" id="pwMeter" hidden><span></span></div>
      <p class="hint" id="pwHint">٨ أحرف على الأقل</p>
    </div>
    <div class="field">
      <label for="regPassword2">تأكيد كلمة المرور</label>
      <input class="input" type="password" id="regPassword2" dir="ltr" autocomplete="new-password" required>
    </div>
    <p class="error-text" id="registerError" hidden></p>
    <button class="btn btn-lg btn-block" type="submit" id="registerBtn">إنشاء الحساب</button>
  </form>

  <div class="owner-hint" id="ownerHint">
    👑 <strong>حساب المدير:</strong> ادخلي ببريد المالك وكلمة مروره للوصول إلى لوحة التحكم.
    نسيتِ كلمة المرور؟ شغّلي <code>npm run password</code> في الطرفية.
  </div>

  <p style="text-align:center;margin:20px 0 0;">
    <a href="/" id="backShop" style="font-size:13.5px;color:var(--ink-mute);">← العودة للمتجر</a>
  </p>
</main>

<script type="module" src="/assets/js/login.js"></script>
</body>
</html>
