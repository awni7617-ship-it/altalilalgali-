name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Fails if a generated file has drifted, or if the one-click deploy path
      # has been broken — a placeholder database id, a missing deploy button.
      - run: npm run check
      - run: npm test
